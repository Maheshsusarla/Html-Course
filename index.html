<!-- Introduction to HTML

Definition:
HTML stands for HyperText Markup Language. 
It is the basic language used to build webpages. 
With HTML we can add headings, text, images, tables, forms, links and many more things to a webpage.

Example: -->

<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<body>
    <h1>Hello World</h1>
</body>
</html>

<!-- HTML Document Structure
Definition:
Every HTML program follows a basic structure. Without this structure the webpage may not work properly in the browser.-->

<!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>
</head>
<body>

</body>
</html>

<!-- Important Tags -->

<!DOCTYPE html> → Defines HTML5 document
<html> → Root element
<head> → Stores metadata
<body> → Visible content
