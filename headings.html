<!-- Definition:
Headings are mainly used for titles and section names in a webpage. 
HTML provides heading tags from h1 to h6. -->

<h1>Main Heading</h1>
<h2>Sub Heading</h2>
<h3>Small Heading</h3>
<h4>Small Heading</h4>
<h5>Small Heading</h5>
<h6>Small Heading</h6>

<!-- 
Paragraph Tag
Definition:
Paragraph tag is used to write normal text content inside a webpage. -->

<p>This is a paragraph.</p>


<!-- Line Break and Horizontal Line
Definition -->

<br> → Breaks line
<hr> → Creates horizontal line

<p>Hello<br>World</p>
<hr>
