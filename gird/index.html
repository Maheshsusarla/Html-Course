<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background-color: brown;
            grid-template-columns: 300px 1fr;
            grid-template-areas: "box-1 box-1 " "box-2 box-3" "box-4 box-4";
        }
        .box{
            border: 2px solid black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .box-1{
            grid-area: box-1;
        }
        .box-2{
            grid-area: box-2;
        }
        .box-3{
            grid-area: box-3;
        }
        .box-4{
            grid-area: box-4;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box box-1">Header</div>
        <div class="box box-2">side bar</div>
        <div class="box box-3">main-cintent</div>
        <div class="box box-4">footer</div>
    </div>  
    
</body>
</html>
