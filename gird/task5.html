<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(12,1fr);
            height: 80vh;
            column-gap: 20px;
            row-gap: 20px;
        }
        .box{
            padding: 10px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .box-1{
            background-color: lightblue;
            grid-column: 1/7;
        }
        .box-2{
            background-color: rgb(255, 140, 0);
            grid-column: 7/13;
        }
        .box-3{
            background-color: pink;
            grid-column: 1/5;
        }
        .box-4{
            background-color: rgb(245, 255, 192);
            grid-column: 5/9;
        }
        .box-5{
            background-color: rgb(17, 255, 0);
            grid-column: 9/13;
        }
        .box-6{
            background-color: rgb(153, 0, 255);
            grid-column: 1/4;
        }
        .box-7{
            background-color: rgb(255, 0, 217);
            grid-column: 4/7;
        }
        .box-8{
            background-color: rgb(255, 0, 0);
            grid-column: 7/10;
        }
        .box-9{
            background-color: rgb(234, 255, 0);
            grid-column:10 /13;     
        }
        .box-10{
            background-color: rgb(0, 255, 123);
            grid-column:1 /3;      
        }
        .box-11{
            background-color: rgb(81, 0, 255);
            grid-column:3 /5 ;       
        }
        .box-12{
            background-color: rgb(0, 255, 195);
            grid-column:5/7;        
        }
        .box-13{
            background-color: rgb(255, 0, 208);
            grid-column:7/9;       
        }
        .box-14{
            background-color: rgb(0, 255, 89);
            grid-column:9/11 ;       
        }
        .box-15{
            background-color: rgb(255, 0, 144);
            grid-column:11 /13 ;       
        }

    </style>
</head>
<body>
     <div class="container">
        <div class="box box-1">6/12</div>
        <div class="box box-2">6/12r</div>
        <div class="box box-3">4/12</div>
        <div class="box box-4">4/12</div>
        <div class="box box-5">4/12</div>
        <div class="box box-6">3/12</div>
        <div class="box box-7">3/12</div>
        <div class="box box-8">3/12</div>
        <div class="box box-9">3/12</div>
        <div class="box box-10">2/12</div>
        <div class="box box-11">2/12</div>
        <div class="box box-12">2/12</div>
        <div class="box box-13">2/12</div>
        <div class="box box-14">2/12</div>
        <div class="box box-15">2/12</div>
    </div> 
    
</body>
</html>
