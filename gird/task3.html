<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows: repeat(4, 1fr);
            height: 100vh;
            column-gap: 10px;
            row-gap: 10px;
        }
        .box{
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-1{
            background-color: red;
            grid-column: 1/2;
        }
        .box-2{
            background-color: rgb(0, 255, 17);
            grid-column: 2/3;
        }
        .box-3{
            background-color: rgb(85, 0, 255);
            grid-column: 3/5;
        }
        .box-4{
            background-color: rgb(255, 0, 166);
            grid-column: 5/6;
        }
        .box-5{
            background-color: rgb(0, 234, 255);
            grid-column: 6/7;
        }
        .box-6{
            background-color: rgb(255, 247, 0);
            grid-column: 1/3;
        }
        .box-7{
            background-color: rgb(255, 0, 51);
            grid-column: 3/5;
            grid-row: 2/4;
        }
        .box-8{
            background-color: rgb(0, 238, 255);
            grid-column: 5/6;
            grid-row: 2/4;
        }
        .box-9{
            background-color: rgb(70, 255, 3);
            grid-column: 6/7;
            grid-row: 2/4;
        }
        .box-10{
            background-color: rgb(47, 0, 255);
            grid-column: 1/3;
        }
        .box-11{
            background-color: rgb(255, 0, 225);
            grid-column: 1/3;
        }
        .box-12{
            background-color: rgb(255, 0, 0);
            grid-column: 3/5;
        }
        .box-13{
            background-color: rgb(242, 255, 3);
            grid-column: 5/7;
        }

    </style>
</head>
<body>
     <div class="container">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>
        <div class="box box-5">5</div>
        <div class="box box-6">6</div>
        <div class="box box-7">7</div>
        <div class="box box-8">8</div>
        <div class="box box-9">9</div>
        <div class="box box-10">10</div>
        <div class="box box-11">11</div>
        <div class="box box-12">12</div>
        <div class="box box-13">13</div>
    </div>
    
</body>
</html>
