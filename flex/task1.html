<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 90vh;
        }
        .box1{
            background-color: rgb(89, 89, 255);
            padding: 20px;
            font-size: 30px;
            text-align: center;
            border: 5px solid black;
        }
        .inside-container{
            display: flex;
        }
        .box2{
            background-color: lightblue;
            height: 400px;
            width: 300px;
            text-align: center;
            font-size: 30px;
        }
        .buttom-container{
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .another-container{
            display: flex;
            justify-content: space-evenly;
        }
        .box3{
            background-color:  rgb(89, 89, 255);
            width: 100%;
            height: 100px;
            text-align: center;
            font-size: 25px;

        }
        .box4{
            background-color: aqua;
            width: 100%;
            height: 300px;
            text-align: center;
            font-size: 25px;
        }
        .box5{
            background-color: rgb(136, 255, 0);
            width: 100%;
            height: 300px;
            text-align: center;
            font-size: 25px;
        }
        .box6{
            background-color: rgb(89, 89, 255);
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            font-size: 30px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Header</div>
        <div class="inside-container">
            <div class="box2">Side Bar</div>
            <div class="buttom-container">
                <div class="box3" >Content -1</div>
                <div class="another-container">
                    <div class="box4" >Content -2</div>
                    <div class="box5">Content -3</div>
                </div>
            </div>
        </div>
        <div class="box6">footer</div>
    </div>
    
</body>
</html>
