<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positions</title>
    <style>
        body{
            background-color: wheat;
        }
        .container{
            position: relative;
        }
        .box{
            width: 200px;
            height: 70px;
            position: absolute;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            color: white;
            border-radius: 5px;
        }
        .box-1{
            background-color: aqua;
            top: 10px;
            left: 60px;
        }
        .box-2{
            background-color: rgb(255, 111, 0);
            top: 60px;
            left: 120px;
        }
        .box-3{
            background-color: rgb(0, 255, 85);
            top: 120px;
            left: 180px;
        }
        .box-4{
            background-color: rgb(255, 0, 208);
            top: 180px;
            left:240px ;
        }
        .box-5{
            background-color: rgb(255, 0, 0);
            top: 240px;
            left: 300px;
        }
        .box-6{
            background-color: rgb(217, 255, 0);
            top: 300px;
            left: 360px;
        }
        .box-7{
            background-color: rgb(0, 38, 255);
            top: 360px;
            left: 400px;
        }
        .h1{
            position: absolute;
            right: 500px;
            top: 150px;
            color:rgb(0, 170, 255);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="h1">Stacking Order</h1>
        <div class="main">
            <div class="box box-1">Background/Borders</div>
            <div class="box box-2">Nagative Z-index</div>
            <div class="box box-3">Block Level Boxes</div>
            <div class="box box-4">Floated Boxes</div>
            <div class="box box-5">Inline Boxes</div>
            <div class="box box-6">Z index = 0</div>
            <div class="box box-7">Position Z-Index</div>
        </div>
    </div>
</body>
</html>
