<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 100px 100px 1fr 100px;
            height: 100vh;
            gap: 20px;
        }
        .div{
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .divs1{
            background-color: green;
            grid-column: 1/3;
        }
        .divs2{
            background-color: blue;grid-column: 1/3;
        }
        .divs3{
            background-color:gray;
        }
        .divs4{
            background-color: rgb(228, 154, 154);
        }
        .divs5{
            background-color: black;
            grid-column: 1/3;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="div divs1">item1</div>
        <div class="div divs2">item2</div>
        <div class="div divs3">item3</div>
        <div class="div divs4">item4</div>
        <div class="div divs5">item5</div>
    </div>
</body>
</html>
